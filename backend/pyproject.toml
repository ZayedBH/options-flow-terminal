[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-terminal-backend"
version = "0.1.0"
description = "Institutional-style options flow trading terminal backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "yfinance>=0.2.40",
    "python-dateutil>=2.9.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "anyio>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# N803/N806: allow Black-Scholes math conventions (S, K, T, r, q)
# UP042: pydantic & Python <3.11 compatibility for str+Enum
# B027: intentional non-abstract default methods on DataAdapter
ignore = ["E501", "B008", "N803", "N806", "UP042", "B027", "SIM108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
